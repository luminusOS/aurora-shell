<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aurora Shell icon: a desktop screen showing GNOME Shell's top bar and a dock
  under an aurora sky, for an extension that adds features to the Shell.
  128x128 GNOME app-icon canvas. The bezel sits on a 4px darker front profile
  resting on the 117px baseline and is lit from the top. Bezel, aurora, dock
  and star use the GNOME HIG palette; the sky is tinted toward violet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Aurora Shell</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="25" x2="0" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="0.05" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="30" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1730"/>
      <stop offset="1" stop-color="#352a55"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="38" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ff0a4"/>
      <stop offset="0.4" stop-color="#33d17a"/>
      <stop offset="1" stop-color="#1a5fb4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="58" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.35" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#9141ac" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="15" y="30" width="98" height="78" rx="5"/>
    </clipPath>
  </defs>

  <rect x="10" y="29" width="108" height="88" rx="10" fill="#3d3846"/>
  <rect x="10" y="25" width="108" height="88" rx="10" fill="url(#bezel)"/>
  <rect x="15" y="30" width="98" height="78" rx="5" fill="url(#sky)"/>

  <g clip-path="url(#screen)">
    <path fill="url(#green)" d="M10 84C30 70 46 76 64 60C80 46 96 40 118 36V96C96 98 80 102 64 104C40 106 26 102 10 104Z"/>
    <path fill="url(#blue)" d="M10 98C32 88 50 94 68 82C86 70 100 66 118 62V112H10Z"/>

    <rect x="15" y="30" width="98" height="10" fill="#000000"/>
    <rect x="54" y="32" width="20" height="4" rx="2" fill="#ffffff"/>

    <rect x="38" y="91" width="52" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="43" y="94" width="10" height="7" rx="2" fill="#57e389"/>
    <rect x="59" y="94" width="10" height="7" rx="2" fill="#62a0ea"/>
    <rect x="75" y="94" width="10" height="7" rx="2" fill="#c061cb"/>
  </g>

  <path fill="#ffffff" d="M36 43C36.8 48 38 49.2 43 50C38 50.8 36.8 52 36 57C35.2 52 34 50.8 29 50C34 49.2 35.2 48 36 43Z"/>
</svg>
