name: Development container image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - .yarn/releases/**
      - .github/workflows/container-image.yml
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - .yarn/releases/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Fedora 44 / GNOME 50 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/luminusos/aurora-shell-dev:fedora44-gnome50
            ghcr.io/luminusos/aurora-shell-dev:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
