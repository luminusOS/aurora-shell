name: Nightly pre-release

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when the latest nightly already points to current main
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-pre-release
  cancel-in-progress: false

jobs:
  nightly-state:
    name: Check for nightly changes
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.state.outputs.head_sha }}
      release_name: ${{ steps.state.outputs.release_name }}
      should_release: ${{ steps.state.outputs.should_release }}
      tag_name: ${{ steps.state.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve nightly state
        id: state
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail

          VERSION_NAME="$(node -e 'const fs = require("fs"); const metadata = JSON.parse(fs.readFileSync("metadata.json", "utf8")); process.stdout.write(metadata["version-name"]);')"
          TAG_PREFIX="v${VERSION_NAME}-nightly"
          LAST_NIGHTLY="$(
            git tag --list "${TAG_PREFIX}*" |
              awk -v prefix="$TAG_PREFIX" '
                index($0, prefix) == 1 {
                  number = substr($0, length(prefix) + 1)
                  if (number ~ /^[0-9]+$/) print number
                }
              ' |
              sort -n |
              tail -n 1
          )"
          NEXT_NIGHTLY=$(( ${LAST_NIGHTLY:-0} + 1 ))
          RELEASE_NAME="${TAG_PREFIX}${NEXT_NIGHTLY}"
          HEAD_SHA="$(git rev-parse HEAD)"
          SHOULD_RELEASE=true

          if [[ "$FORCE_RELEASE" != "true" && -n "$LAST_NIGHTLY" ]]; then
            LAST_TAG="${TAG_PREFIX}${LAST_NIGHTLY}"
            LAST_SHA="$(git rev-parse "${LAST_TAG}^{commit}")"
            if [[ "$LAST_SHA" == "$HEAD_SHA" ]]; then
              SHOULD_RELEASE=false
            fi
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "Nightly ${RELEASE_NAME} will be built from ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No commits have reached main since ${TAG_PREFIX}${LAST_NIGHTLY}; nightly skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: [nightly-state]
    if: needs.nightly-state.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.nightly-state.outputs.head_sha }}

  pre-release:
    name: Create nightly pre-release
    runs-on: ubuntu-latest
    needs: [nightly-state, ci]
    if: needs.nightly-state.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.nightly-state.outputs.head_sha }}

      - name: Download extension zip
        uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist/target/

      - name: Create nightly pre-release tag
        run: |
          set -euo pipefail
          git tag "${{ needs.nightly-state.outputs.tag_name }}" "${{ needs.nightly-state.outputs.head_sha }}"
          git push origin "refs/tags/${{ needs.nightly-state.outputs.tag_name }}"

      - name: Create or update GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.nightly-state.outputs.tag_name }}
          target_commitish: ${{ needs.nightly-state.outputs.head_sha }}
          name: ${{ needs.nightly-state.outputs.release_name }}
          files: dist/target/aurora-shell@luminusos.github.io.shell-extension.zip
          generate_release_notes: true
          prerelease: true
          make_latest: false
          overwrite_files: true

      - name: Delete old pre-releases
        uses: Nats-ji/delete-old-releases@v1
        with:
          token: ${{ github.token }}
          keep-count: 3
          keep-old-minor-releases: true
          include-prerelease: true
          semver-loose: true
          remove-tags: true
