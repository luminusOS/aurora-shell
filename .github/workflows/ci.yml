name: CI

on:
  pull_request:
  merge_group:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_IMAGE: ghcr.io/luminusos/aurora-shell-dev:fedora44-gnome50

jobs:
  lint:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare development image
        run: docker pull "$DEV_IMAGE" || docker build --tag "$DEV_IMAGE" .

      - name: Validate
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$DEV_IMAGE" \
            bash -lc 'just deps && just validate'

  unit-tests:
    name: Unit & regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare development image
        run: docker pull "$DEV_IMAGE" || docker build --tag "$DEV_IMAGE" .

      - name: Run unit tests
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$DEV_IMAGE" \
            bash -lc 'just deps && just unit-test'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare development image
        run: docker pull "$DEV_IMAGE" || docker build --tag "$DEV_IMAGE" .

      - name: Build extension package
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$DEV_IMAGE" \
            bash -lc 'just deps && just package'

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/target/aurora-shell@luminusos.github.io.shell-extension.zip
          retention-days: 1

  integration-tests:
    name: Integration tests (GNOME 50)
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Download extension zip
        uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: dist/target/

      - name: Prepare development image
        run: docker pull "$DEV_IMAGE" || docker build --tag "$DEV_IMAGE" .

      - name: Run integration tests
        run: |
          docker run --rm --privileged \
            --env DISPLAY=:0 \
            --env GDK_DEBUG=no-portals \
            --env LIBGL_ALWAYS_SOFTWARE=1 \
            --env WAYLAND_DISPLAY=gnome-shell-test-display \
            --env XDG_RUNTIME_DIR=/tmp/xdg-runtime \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$DEV_IMAGE" \
            bash -lc '
              install -d -m 0700 "$XDG_RUNTIME_DIR"
              mkdir -p /run/dbus
              dbus-daemon --system --fork --nopidfile
              python3 -m dbusmock --system --template logind &
              logind_pid=$!
              trap "kill $logind_pid 2>/dev/null || true" EXIT
              sleep 1
              bash scripts/run-shell-tests.sh \
                dist/target/aurora-shell@luminusos.github.io.shell-extension.zip
            '
